[package]
name = "gooseswitcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "IBus layout correction engine for Russian and English"

[features]
default = []
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
directories = "6"
encoding_rs = "0.8"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spellbook = "0.4.2"

[dev-dependencies]
tempfile = "3"
